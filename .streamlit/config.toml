[theme]
base = "dark"
primaryColor = "#FF7A2F"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1D20"
textColor = "#FFFFFF"
linkColor = "#FFFFFF"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, system-ui, 'Segoe UI', Roboto, sans-serif"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap, Georgia, serif"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
baseFontSize = 16
baseRadius = "6px"
buttonRadius = "6px"
borderColor = "#3A3B3F"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#050505"
secondaryBackgroundColor = "#1C1D20"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
